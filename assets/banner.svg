<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" fill="none">
  <defs>
    <linearGradient id="bgMain" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1022"/>
      <stop offset="55%" stop-color="#0f172e"/>
      <stop offset="100%" stop-color="#131936"/>
    </linearGradient>
    <linearGradient id="tileBg" x1="60" y1="70" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151c3b"/>
      <stop offset="100%" stop-color="#090d1e"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="133" y1="112" x2="117" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="chevGrad" x1="146" y1="118" x2="173" y2="162" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
