  <path d="M127.2 111.3H137.0L120.6 168.1H110.8L127.2 111.3Z" fill="url(#slashGrad)"/>
  <!-- '>' -->
  <path d="M143.2 119H154.8L168.8 139.7L154.8 160.4H143.2L157.2 139.7L143.2 119Z" fill="url(#chevGrad)"/>

