  <text x="898" y="175" fill="#94a3b8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">design: <tspan fill="#f9a8d4">"Canva Visuals"</tspan>,</text>
  <text x="898" y="200" fill="#94a3b8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">study: <tspan fill="#fde68a">"Unisbank Sem. 5"</tspan></text>
  <text x="882" y="222" fill="#a78bfa" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">&#125;;</text>
