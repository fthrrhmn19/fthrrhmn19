  <text x="230" y="142" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'Segoe UI', 'Arial', sans-serif" font-size="48" font-weight="800" letter-spacing="-0.8">Fathur Rohman</text>
  <text x="232" y="178" fill="#CBD5E1" font-family="'Plus Jakarta Sans', 'Segoe UI', 'Arial', sans-serif" font-size="20" font-weight="500">Web &amp; Software Developer  •  REST APIs  •  Graphic Design (Canva)</text>

