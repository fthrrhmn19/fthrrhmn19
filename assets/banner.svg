    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Frame -->
  <rect x="2" y="2" width="1196" height="276" rx="20" fill="url(#bgMain)" stroke="#273463" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="276" rx="20" fill="url(#grid)"/>

  <!-- Top Subtle Accent Line -->
  <path d="M40 3H360" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

  <!-- Bespoke F/> Brand Tile (Scaled cleanly inside 60..200, 70..210) -->
  <rect x="56" y="70" width="140" height="140" rx="34" fill="url(#tileBg)" stroke="#2c3a6f" stroke-width="3.5"/>
  <rect x="61" y="75" width="130" height="130" rx="29" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
  <!-- 'F' -->
  <path d="M83 114.6C83 112.78 84.48 111.3 86.3 111.3H118.4L115.1 122.7H94.8V134H111.4L108.1 145.2H94.8V164.8C94.8 166.62 93.32 168.1 91.5 168.1H86.3C84.48 168.1 83 166.62 83 164.8V114.6Z" fill="#F8FAFC"/>
