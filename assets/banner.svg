  <circle cx="902" cy="58" r="5" fill="#f59e0b" fill-opacity="0.85"/>
  <circle cx="920" cy="58" r="5" fill="#10b981" fill-opacity="0.85"/>
  <text x="1008" y="62" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5">profile.ts</text>

  <text x="882" y="100" fill="#a78bfa" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">const <tspan fill="#f8fafc">fathur</tspan> <tspan fill="#38bdf8">=</tspan> &#123;</text>
  <text x="898" y="125" fill="#94a3b8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">focus: <tspan fill="#7dd3fc">"Full-Stack &amp; API"</tspan>,</text>
